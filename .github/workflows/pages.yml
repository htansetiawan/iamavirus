name: Publish architecture notebook and docs

on:
  push:
    branches: [main]
    paths:
      - index.html
      - docs/**
      - tools/render_docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: architecture-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'htansetiawan/iamavirus'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare standalone site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          python -m pip install -q markdown==3.7
          python tools/render_docs.py docs _site/docs --base ./
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
