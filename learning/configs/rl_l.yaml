rl:
  init: checkpoints/v6-l/best.pt
  critic_init: checkpoints/critic-vs/best.pt
  games: 256
  max_plies: 300
  env_threads: 1
  rollout_decisions: 16384
  iterations: 120
  lr: 1.0e-05
  critic_lr: 0.0001
  clip: 0.2
  epochs: 2
  minibatch: 2048
  kl_ref_coef: 0.05
  entropy_coef: 0.003
  grad_clip: 1.0
  gamma: 1.0
  lambda: 0.95
  temperature: 1.0
  seed: 1
  league:
    reference: 2.0
    replica_weight: 1.0
    snapshot_weight: 1.0
    snapshot_every: 10
    # Fixed group quotas prevent a growing flat snapshot list from diluting
    # direct practice against target opponents. These are an initial curriculum
    # hypothesis, not a measured optimum. The imitation reference is grouped
    # with the other leader replicas; its separate KL role remains unchanged.
    group_weights:
      target_opponents: 0.40
      ta_controls: 0.25
      other_leaders: 0.20
      self_play: 0.15
    snapshot_sample_capacity: 6 # newest six sampled; older models stay for in-flight games
    member_groups:
      reference: other_leaders
      duck: target_opponents
      duck-b: target_opponents
      instructors: target_opponents
      instructors-b: target_opponents
      ta-baseline-p: ta_controls
      ta-baseline-a: ta_controls
      ta-baseline-s: ta_controls
      greek-gift: other_leaders
      knight-vision: other_leaders
      decent-chess-bot: other_leaders
      strongly-invisible: other_leaders
    replicas:
      duck: checkpoints/replica-duck/best.pt
      duck-b: checkpoints/replica-duck/best.pt
      instructors: checkpoints/replica-instructors/best.pt
      instructors-b: checkpoints/replica-instructors/best.pt
      ta-baseline-p: checkpoints/replica-ta-baseline-p/best.pt
      ta-baseline-a: checkpoints/replica-ta-baseline-a/best.pt
      ta-baseline-s: checkpoints/replica-ta-baseline-s/best.pt
      greek-gift: checkpoints/replica-greek-gift/best.pt
      knight-vision: checkpoints/replica-knight-vision/best.pt
      decent-chess-bot: checkpoints/replica-decent-chess-bot/best.pt
      strongly-invisible: checkpoints/replica-strongly-invisible/best.pt
    snapshots: []
_comment: 'RL from the 20.4M network (size sweep, 2026-10-09). League tilted toward
  the targets through the config: duck and Instructors listed twice (4 of 11 replica
  units), snapshots at a quarter weight. Requires the mixed-width recurrent-memory
  and successor-bootstrap fixes in learning/rl_train.py (Astra, 2026-10-09).'
