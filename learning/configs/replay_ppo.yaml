# Starting configuration for replay pretraining (stage A) and recurrent PPO
# (stage B). Every number here is an initial value from the specification, to
# be tuned on validation data, not a measured optimum.

pretrain:
  window: 64                 # observation events per sequence
  sequences_per_batch: 8
  accumulation_steps: 1
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  epochs: 10
  loss_weights:
    policy: 1.0
    belief: 1.0
    danger: 1.0
    value: 0.25
  mixed_precision: false     # enable only after full-precision correctness passes
  seed: 1
  validation_sequences: 256  # episodes evaluated at each validation pass
  # Per-player weight on the policy cloning loss, keyed by the arena player id
  # (name for corpus-built replays). Belief, danger and value targets are not
  # weighted: they are facts about hidden pieces whoever played.
  player_weights:
    default: 1.0
    f394d843d970454f868c38c7f6963cc9: 4.0   # Greek Gift (2141)
    knight-vision: 4.0                      # Knight Vision (2104)
    strongly-invisible: 3.0                 # Strongly Invisible (2089, staff)
    db107815c3b14827a79ec9e3d12f4726: 3.0   # Decent Chess Bot (2078)
    8d775e234808489c815a4a9f6bbabfe4: 2.0   # duck (1885)
    instructors: 2.0                        # Instructors (1918, staff)
    a2c35173659545c99752376a70418438: 0.5   # IAmAVirus (ourselves)

ppo:
  learning_rate: 1.0e-4
  clip_ratio: 0.2
  grad_clip: 0.5
  epochs_per_batch: 2
  rollout_decisions: 8192
  gamma: 1.0
  gae_lambda: 0.95
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  belief_coefficient: 0.1
  danger_coefficient: 0.1
  target_kl: 0.02
  window: 64
  sequences_per_minibatch: 8
  games_in_flight: 32        # simultaneous simulator games (CPU) batched on the GPU
  max_plies: 1000
  league:
    recent_share: 0.5
    older_share: 0.25
    fixed_share: 0.25
    fixed_opponents: ["capture-greedy", "uniform-random", "cpp:20000"]
  evaluation_interval_decisions: 1000000
  smoke_evaluation_games: 40
