# v18: deep RL (GYM.md 3.8). Regularised PPO from the v4 imitation network, true-board critic,
# league of the imitation reference, team replicas and learner snapshots.
rl:
  init: checkpoints/pretrain-v4/best.pt
  critic_init: checkpoints/critic-vs/best.pt
  games: 256
  max_plies: 300
  env_threads: 1
  rollout_decisions: 16384
  iterations: 60
  lr: 1.0e-5
  critic_lr: 1.0e-4
  clip: 0.2
  epochs: 2
  minibatch: 2048
  kl_ref_coef: 0.05
  entropy_coef: 0.003
  grad_clip: 1.0
  gamma: 1.0
  lambda: 0.95
  temperature: 1.0
  seed: 1
  league:
    reference: 2.0
    replica_weight: 1.0
    snapshot_weight: 1.0
    snapshot_every: 5
    replicas:
      ta-baseline-p: checkpoints/replica-ta-baseline-p/best.pt
      ta-baseline-a: checkpoints/replica-ta-baseline-a/best.pt
      ta-baseline-s: checkpoints/replica-ta-baseline-s/best.pt
      duck: checkpoints/replica-duck/best.pt
      greek-gift: checkpoints/replica-greek-gift/best.pt
      knight-vision: checkpoints/replica-knight-vision/best.pt
