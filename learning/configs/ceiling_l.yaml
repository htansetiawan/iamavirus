# Ceiling study (2026-10-08): model size with one shared recipe on manifest v4
# (features-v2, 3,766 training games). Size l: 192 channels, 12 blocks,
# GRU 768. Selection on validation policy loss; belief/danger/value logged.
pretrain:
  model: {channels: 192, blocks: 12, hidden: 768, cand_width: 384}
  window: 64
  sequences_per_batch: 32
  accumulation_steps: 1
  learning_rate: 2.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  epochs: 16
  cosine_steps: 3800
  select_on: policy
  loss_weights:
    policy: 1.0
    belief: 1.0
    danger: 1.0
    value: 0.25
  mixed_precision: true
  seed: 1
  validation_sequences: 512
  player_weights:
    default: 1.0
